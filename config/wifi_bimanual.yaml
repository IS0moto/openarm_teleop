robot:
  arm_type: "v10"
  right_arm:
    leader_can: "can0"
    follower_can: "can2"
    udp_port: 50000
  left_arm:
    leader_can: "can1"
    follower_can: "can3"
    udp_port: 50001

network:
  follower_ip: "172.30.21.146"
  bind_ip: "0.0.0.0"
  packet_size_bytes: 250
  use_crc32: true

control:
  send_rate_hz: 500
  follower_control_rate_hz: 500
  startup_rate_hz: 250
  use_startup_rate: true

safety:
  require_enable: true
  watchdog_warning_ms: 20
  watchdog_hold_ms: 50
  watchdog_disable_ms: 100
  initial_pose_max_error_rad: 0.3
  max_target_delta_rad_per_cycle: 0.02
  max_joint_velocity_rad_s: 1.5
  reject_out_of_order_packets: true

logging:
  print_stats_hz: 1
  log_csv: true
  log_dir: "logs"
